[package]
name = "kalango-remote-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Kalango Remote · processo do núcleo (RustDesk): compartilhar, controlar, túnel do Cloudflare"
publish = false

[[bin]]
name = "kalango-remote-core"
path = "src/main.rs"

[features]
linux-pkg-config = ["librustdesk/linux-pkg-config"]

[dependencies]
librustdesk = { package = "rustdesk", path = "../..", default-features = false, features = ["use_dasp"] }
hbb_common = { path = "../../libs/hbb_common" }
kalango-remote-proto = { path = "../proto" }
serde_json = "1"
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29", features = ["rustls-tls-webpki-roots"] }
libc = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
repng = "0.2"
