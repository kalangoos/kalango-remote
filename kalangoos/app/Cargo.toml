[package]
name = "kalango-remote"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Kalango Remote · acesso remoto nativo do KalangoOS (GTK 4); o núcleo do RustDesk roda em kalango-remote-core"
publish = false
build = "build.rs"

[features]
default = ["layer-shell"]
# the "being controlled" outline and banner over the whole screen (gtk4-layer-shell, shipped by KalangoOS)
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
gio = { version = "0.20", features = ["v2_80"] }
gtk4-layer-shell = { version = "0.5", optional = true }
async-channel = "2"
kalango-remote-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
libc = "0.2"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
