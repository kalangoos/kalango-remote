[package]
name = "wlr_remote"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Kalango Remote: screen capture (wlr-screencopy) and input (wlr virtual-pointer, zwp virtual-keyboard) for compositors without the RemoteDesktop portal, such as niri"
publish = false

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
rustix = { version = "1", features = ["fs", "mm", "event"] }
log = "0.4"
